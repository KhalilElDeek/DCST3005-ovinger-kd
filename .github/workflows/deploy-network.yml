name: Roll out network

on:
  push:
    branches: [main]
    paths:
      - 'oving5/stacks/network/**'
      - 'oving5/modules/network/**'
      - 'oving5/shared/backend.hcl'
      - '.github/workflows/deploy-network.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Miljø - gjelder bare ved manuell kjøring
        type: choice
        options: [dev, test]
        default: dev

permissions:
  id-token: write
  contents: read

# K9: push kjører ALLTID dette workflow_run uten inputs - uttrykket under
# faller da tilbake på 'dev'. Det finnes ingen vei fra en push til test.
concurrency:
  group: network-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: oving5/stacks/network

    env:
      MILJO: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # K5: parameterverdiene hentes fra Key Vault under kjøring, ikke fra en
      # .tfvars-fil i repoet. Navnet params.auto.tfvars er ikke tilfeldig -
      # alt som heter *.auto.tfvars leses automatisk av Terraform.
      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving5/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/network.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan

      - name: Apply
        run: terraform apply -auto-approve

      - name: Verifiser at networket finnes i Azure
        run: |
          RG=$(terraform output -raw resource_group_name)
          VNET=$(terraform output -raw vnet_name)
          STATE=$(az network vnet show --resource-group "$RG" --name "$VNET" \
                    --query provisioningState -o tsv)
          echo "$VNET i $RG: $STATE"
          test "$STATE" = "Succeeded"

      # K5: slettes igjen, også når apply feilet - if: always()
      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
