name: Verifiser innlogging mot Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Hvilket miljø skal testes
        type: choice
        options: [dev, test]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  verifiser:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hvem er jeg?
        run: az account show --output json
